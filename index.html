<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening App...</title>
</head>

<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">

    <h2>Opening App...</h2>
    <p id="status">Attempting to launch your app.</p>

    <p>
        <a id="fallback-link" href="#" style="display:none;">
            Click here to open
        </a>
    </p>

    <script>
        const params = new URLSearchParams(window.location.search);

        let destination = params.get("url");

        // Preserve existing Shortcut links
        if (!destination && params.get("name")) {
            destination = "shortcuts://run-shortcut?name=" +
                encodeURIComponent(params.get("name"));
        }

        const status = document.getElementById("status");
        const fallback = document.getElementById("fallback-link");

        if (destination) {
            try {
                const parsed = new URL(destination);

                // Permit only supported app-link schemes.
                const allowedSchemes = [
                    "shortcuts:",
                    "kindle:",
                    "ical:",
                    "mailto:",
                    "facetime:",
                    "tel:",
                    "sms:",
                    "maps:",
                    "x-apple-reminderkit:"
                ];

                if (!allowedSchemes.includes(parsed.protocol)) {
                    throw new Error("Unsupported URL scheme");
                }

                fallback.href = destination;
                fallback.style.display = "inline";

                window.location.href = destination;

            } catch (error) {
                status.textContent =
                    "Unable to open this link: " + error.message;
            }
        } else {
            status.textContent = "No destination provided.";
        }
    </script>

</body>
</html>
